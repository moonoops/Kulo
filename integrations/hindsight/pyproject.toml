[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "moco-hindsight-auth"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "In-process Router/Worker authorization for Moco's two Hindsight banks"
requires-python = ">=3.11"
dependencies = ["hindsight-api-slim==1.2.1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "pg0-embedded>=0.16.1"]

[project.scripts]
moco-hindsight-api = "moco_hindsight.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/moco_hindsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: starts isolated PostgreSQL and the real Hindsight HTTP server"]

